name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/test_protocol.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/web_page_test.cjs
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [hc33, nrf54-camera]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'platformio>=6.1,<7' 'ninja>=1.11,<2'
      - run: |
          export EDGEZ_NINJA="$(python -c 'import ninja; print(ninja.BIN_DIR + "/ninja")')"
          pio run -e ${{ matrix.environment }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/firmware.bin
            .pio/build/${{ matrix.environment }}/firmware.hex
            .pio/build/${{ matrix.environment }}/firmware.elf
